# Upptime config for the YGGR public status page.
# Docs: https://upptime.js.org/docs/configuration
# Context: ADR-004 in ambushhere/yggr-compute (docs/adr/ADR-004-public-status-page.md).
owner: ambushhere
repo: yggr-status

# Upptime opens a GitHub issue when a site goes down and assigns it here.
assignees:
  - ambushhere

sites:
  # Landing page (GitHub Pages).
  - name: Website
    url: https://yggr.io

  # Customer portal (Next.js behind Caddy on the production host).
  - name: Customer portal
    url: https://app.yggr.io/api/health

  # Public REST API. Unauthenticated requests must get 401 from the API
  # handler; anything else (5xx, timeout, Caddy error page) means it is down.
  - name: Public API
    url: https://app.yggr.io/api/v1/instances
    expectedStatusCodes:
      - 401

  # OPTIONAL: team chat (Zulip). Jonatan has not decided whether it is public.
  # Zulip's /health is localhost-only (403), so use the public settings endpoint.
  # - name: Team chat
  #   url: https://chat.yggr.io/api/v1/server_settings

status-website:
  # Phase 1 (until status.yggr.io CNAME exists at GoDaddy): served at
  # https://ambushhere.github.io/yggr-status/ via baseUrl.
  # Phase 2 (after DNS): remove baseUrl, uncomment cname.
  # cname: status.yggr.io
  baseUrl: /yggr-status
  name: YGGR Status
  introTitle: "**YGGR Compute** service status"
  introMessage: >-
    Live availability of the YGGR website, customer portal and public API,
    checked every 5 minutes from outside our infrastructure. Incidents and
    maintenance are posted here.
  navbar:
    - title: Status
      href: /
    - title: yggr.io
      href: https://yggr.io
    - title: Incidents
      href: https://github.com/$OWNER/$REPO/issues?q=label%3Aincident
